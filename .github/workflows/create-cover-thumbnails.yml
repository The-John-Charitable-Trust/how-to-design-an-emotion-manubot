name: Create cover thumbnails

on:
  push:
    paths:
      - ".github/workflows/create-cover-thumbnails.yml"
      - "assets/covers/how-to-design-an-emotion/cover.jpg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crop-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          convert --version

      - name: Create front and back cover images
        run: |
          src="assets/covers/how-to-design-an-emotion/cover.jpg"
          outdir="${RUNNER_TEMP}/cover-thumbnails"
          mkdir -p "$outdir"
          w=$(identify -format "%w" "$src")
          h=$(identify -format "%h" "$src")
          back_w=$((w * 49 / 100))
          front_x=$((w * 51 / 100))
          front_w=$((w - front_x))
          convert "$src" -crop "${back_w}x${h}+0+0" +repage -quality 90 "$outdir/back-cover.jpg"
          convert "$src" -crop "${front_w}x${h}+${front_x}+0" +repage -quality 90 "$outdir/front-cover.jpg"
          echo "Generated thumbnails in $outdir"

      - name: Upload thumbnails as artifacts
        uses: actions/upload-artifact@65c4c4a5ddee575a47d8b7fcb8b8ff950ba2d8c19 # v4.6.0
        with:
          name: cover-thumbnails
          path: ${{ runner.temp }}/cover-thumbnails/
          retention-days: 30
