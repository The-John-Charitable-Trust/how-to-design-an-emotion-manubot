name: Build manuscript

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r publishing/requirements.lock

      - name: Assemble manuscript
        run: python scripts/assemble_manuscript.py --manifest publishing/manuscript.yml --output build/output/

      - name: Build DOCX
        run: python scripts/build_docx.py --input build/output/manuscript.md --output build/output/How-To-Design-an-Emotion-Master.docx

      - name: Upload DOCX artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-docx
          path: build/output/How-To-Design-an-Emotion-Master.docx
          retention-days: 90
